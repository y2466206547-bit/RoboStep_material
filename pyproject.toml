[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robostep-supplement"
version = "0.1.0"
description = "Reference interfaces for staged online robot reward learning"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
torch = ["torch>=2.0"]
benchmarks = ["gymnasium>=0.28", "metaworld", "mani-skill"]
m10 = ["rsl-rl-lib>=5.5", "tensordict>=0.14", "metaworld", "mujoco"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
task_registry = ["manifest.json", "task_manifest.csv", "reward_machines/**/*.json"]
